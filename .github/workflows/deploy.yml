name: Deploy React app to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write # serve a gh-pages per pubblicare sul branch gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # "npm run deploy" esegue già "predeploy" (la build): non serve un passo separato.
      - name: Build and deploy to GitHub Pages
        run: npm run deploy
